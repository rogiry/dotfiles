name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 룰셋의 required status check 가 이 job 이름("validate")을 참조한다. 바꾸지 말 것.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 검사 내용은 tests/validate.sh 한 곳에만 적는다. 로컬 Stop 훅도 같은 파일을
      # 돌리므로 "로컬은 통과하는데 CI 만 빨간불" 이 구조적으로 생기지 않는다.
      # 여기서는 그 스크립트가 필요로 하는 도구만 갖춘다.
      - name: 검증 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh >/dev/null   # shellcheck·ruby·jq 는 러너에 기본 포함
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 검증
        run: bash tests/validate.sh
